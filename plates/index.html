<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Plate calculator | BitRep</title>
<meta name="description" content="Type a weight and see which plates to put on each side of the bar. Pounds or kilos.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0E1020">
<meta name="color-scheme" content="dark">
<link rel="icon" href="../favicon.ico" sizes="any">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="stylesheet" href="../home.css?v=1">
<style>
/* Plate calculator. Uses the home page's colours, type and buttons. */
.calc { max-width: 720px; margin: 0 auto; padding-top: clamp(28px, 5vw, 64px); padding-bottom: 72px; }
.calc h1 { font-size: clamp(34px, 7vw, 56px); text-align: center; }
.calc .lede { text-align: center; margin: 14px auto 0; }
.panel { background: var(--card); border-radius: var(--r-card); padding: clamp(18px, 4vw, 28px); margin-top: 28px; }
.entry { display: flex; align-items: stretch; gap: 8px; }
.entry button { width: 56px; border: 0; border-radius: var(--r-control); background: var(--raised); color: var(--text); font: 700 26px/1 var(--body); cursor: pointer; }
.entry button:active { transform: scale(0.96); }
.entry .field { flex: 1; display: flex; align-items: baseline; justify-content: center; gap: 8px; height: 76px; border-radius: var(--r-control); background: var(--ground); box-shadow: inset 0 0 0 1px var(--line); padding-top: 14px; }
.entry .field:focus-within { box-shadow: inset 0 0 0 2px var(--accent); }
.entry input { width: 4.2ch; border: 0; background: transparent; color: var(--text); font: 700 44px/1 var(--body); letter-spacing: -0.03em; text-align: right; outline: 0; -moz-appearance: textfield; }
.entry input::-webkit-outer-spin-button, .entry input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.entry .unit { color: var(--muted); font-weight: 700; font-size: 18px; }
.quick { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.chip-btn { min-height: 44px; padding: 0 14px; border: 0; border-radius: var(--r-control); background: var(--raised); color: var(--text); font: 700 15px/1 var(--body); cursor: pointer; }
.chip-btn[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.chip-btn.off { background: transparent; color: var(--dim); box-shadow: inset 0 0 0 1px var(--line); text-decoration: line-through; }
.rowlabel { display: block; font-size: 13px; font-weight: 700; color: var(--muted); letter-spacing: 0.04em; margin: 20px 0 8px; }
.opts { display: grid; gap: 0 24px; }
@media (min-width: 620px) { .opts { grid-template-columns: auto auto 1fr; } }
.seg { display: flex; gap: 8px; flex-wrap: wrap; }

/* The bar: hard-edged blocks, no curves, like the app's pixel art */
.stage { margin-top: 28px; text-align: center; }
.barwrap { overflow-x: auto; padding: 6px 0 2px; }
.barbell { display: inline-flex; align-items: center; justify-content: center; min-width: 100%; height: 190px; }
.barbell .shaft { height: 10px; background: #8E93B0; flex: 0 0 clamp(60px, 22vw, 150px); }
.barbell .collar { width: 10px; height: 34px; background: #C9CCE0; flex: none; }
.barbell .sleeve { height: 16px; background: #A9AEC8; flex: 0 0 18px; }
.barbell .end { height: 16px; width: 22px; background: #A9AEC8; flex: none; }
.plate { flex: none; display: flex; align-items: center; justify-content: center; margin: 0 1px; font: 700 11px/1 var(--body); letter-spacing: -0.04em; color: #0E1020; box-shadow: inset 0 4px 0 rgba(255,255,255,0.28), inset 0 -4px 0 rgba(0,0,0,0.22); }
.ground-line { height: 4px; background: var(--mint); max-width: 560px; margin: 0 auto; }
.per { margin-top: 22px; font-size: clamp(22px, 4.6vw, 30px); font-weight: 700; letter-spacing: -0.02em; text-wrap: balance; }
.per small { display: block; font-size: 15px; font-weight: 400; color: var(--muted); letter-spacing: 0; margin-bottom: 6px; }
.note { color: var(--muted); margin-top: 10px; min-height: 1.5em; }
.cta { margin-top: 44px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 12px; }
.cta p { color: var(--muted); max-width: 44ch; }
</style>
</head>
<body>
<header class="bar">
  <div class="bar-in wrap">
    <a href="../" aria-label="BitRep home"><img class="wordmark" src="../img/bitrep-wordmark-white.svg" alt="BitRep" width="130" height="28"></a>
    <a class="btn" href="../#join">Get early access</a>
  </div>
</header>

<main class="wrap calc">
  <h1>Plate calculator</h1>
  <p class="lede">Type the weight you want on the bar. We'll tell you what goes on each side.</p>

  <div class="panel">
    <div class="entry">
      <button type="button" id="minus" aria-label="Lighter">&minus;</button>
      <label class="field"><span class="visually-hidden">Total weight</span><input id="w" type="number" inputmode="decimal" min="0" step="any" value="225"><span class="unit" id="unit">lb</span></label>
      <button type="button" id="plus" aria-label="Heavier">+</button>
    </div>
    <div class="quick" id="quick" aria-label="Common weights"></div>

    <div class="opts">
      <div><span class="rowlabel">UNITS</span><div class="seg" id="units"></div></div>
      <div><span class="rowlabel">BAR</span><div class="seg" id="bars"></div></div>
      <div><span class="rowlabel">PLATES YOU HAVE</span><div class="seg" id="have"></div></div>
    </div>
  </div>

  <div class="stage" aria-live="polite">
    <div class="barwrap"><div class="barbell" id="bar" role="img" aria-label=""></div></div>
    <div class="ground-line"></div>
    <p class="per"><small id="perlabel">Each side</small><span id="per"></span></p>
    <p class="note" id="note"></p>
  </div>

  <div class="cta">
    <p>BitRep is a workout tracker coming to iPhone. It remembers what you lifted last time, so you can skip the math.</p>
    <a class="btn" href="../#join">Get early access</a>
  </div>
</main>

<script>
(function () {
  var SETS = {
    lb: { bars: [45, 35, 15], plates: [45, 35, 25, 10, 5, 2.5], quick: [135, 185, 225, 275, 315, 405], step: 5 },
    kg: { bars: [20, 15, 10], plates: [25, 20, 15, 10, 5, 2.5, 1.25], quick: [60, 80, 100, 120, 140, 180], step: 2.5 }
  };
  // colour and drawn height for each plate, heaviest first
  var LOOK = {
    lb: { 45: ['#8F8DFF', 170], 35: ['#FFC93C', 150], 25: ['#5EE0B0', 128], 10: ['#F3F3FA', 96], 5: ['#A3A8C4', 74], 2.5: ['#6F7496', 58] },
    kg: { 25: ['#FF7A7A', 170], 20: ['#8F8DFF', 170], 15: ['#FFC93C', 150], 10: ['#5EE0B0', 128], 5: ['#F3F3FA', 96], 2.5: ['#A3A8C4', 74], 1.25: ['#6F7496', 58] }
  };
  var unit = 'lb', bar = 45, off = {}, $ = function (id) { return document.getElementById(id); };
  var fmt = function (n) { return String(Math.round(n * 100) / 100); };

  // Fewest plates that add up to one side, using only the plates switched on. Works in quarter units.
  function solve(side, plates) {
    var T = Math.round(side * 4), best = [0], from = [0], use = [0], i, p;
    for (i = 1; i <= T; i++) { best[i] = Infinity; for (p = 0; p < plates.length; p++) { var u = Math.round(plates[p] * 4); if (u <= i && best[i - u] + 1 < best[i]) { best[i] = best[i - u] + 1; from[i] = i - u; use[i] = plates[p]; } } }
    var t = T; while (t > 0 && best[t] === Infinity) t--;
    var out = []; for (i = t; i > 0; i = from[i]) out.push(use[i]);
    return { plates: out.sort(function (a, b) { return b - a; }), side: t / 4, exact: t === T };
  }

  function seg(box, items, isOn, onPick, cls) {
    box.textContent = '';
    items.forEach(function (it) {
      var b = document.createElement('button'); b.type = 'button'; b.className = 'chip-btn' + (cls ? ' ' + cls(it) : ''); b.textContent = it.label;
      b.setAttribute('aria-pressed', isOn(it) ? 'true' : 'false'); b.addEventListener('click', function () { onPick(it); }); box.appendChild(b);
    });
  }

  function controls() {
    var S = SETS[unit];
    $('unit').textContent = unit;
    seg($('units'), [{ v: 'lb', label: 'Pounds' }, { v: 'kg', label: 'Kilos' }], function (i) { return i.v === unit; }, function (i) {
      if (i.v === unit) return; unit = i.v; bar = SETS[unit].bars[0]; off = {}; $('w').value = unit === 'lb' ? 225 : 100; controls(); draw(); });
    seg($('bars'), S.bars.map(function (b) { return { v: b, label: fmt(b) + ' ' + unit }; }), function (i) { return i.v === bar; }, function (i) { bar = i.v; controls(); draw(); });
    seg($('have'), S.plates.map(function (p) { return { v: p, label: fmt(p) }; }), function (i) { return !off[i.v]; }, function (i) { off[i.v] = !off[i.v]; controls(); draw(); }, function (i) { return off[i.v] ? 'off' : ''; });
    seg($('quick'), S.quick.map(function (q) { return { v: q, label: fmt(q) }; }), function (i) { return +$('w').value === i.v; }, function (i) { $('w').value = i.v; controls(); draw(); });
  }

  function plateEl(p) {
    var look = LOOK[unit][p], d = document.createElement('span'); d.className = 'plate';
    d.style.background = look[0]; d.style.height = look[1] + 'px'; d.style.width = (p >= 25 || (unit === 'kg' && p >= 15) ? 26 : p >= 5 ? 18 : 12) + 'px';
    if (look[1] >= 96) d.textContent = fmt(p);
    return d;
  }
  function block(cls) { var d = document.createElement('span'); d.className = cls; return d; }

  var LINES = { lb: { 135: "One plate a side.", 225: "Two plates a side.", 315: "Three plates a side.", 405: "Four plates a side.", 495: "Five plates a side. Who are you?" },
                kg: { 60: "One plate a side.", 100: "Two plates a side.", 140: "Three plates a side.", 180: "Four plates a side.", 220: "Five plates a side. Who are you?" } };

  function draw() {
    var S = SETS[unit], total = parseFloat($('w').value), el = $('bar'); el.textContent = '';
    var std = unit === 'lb' ? 45 : 20;
    // the standard plate is tried first, so a tie goes to the load lifters expect (20 + 20, not 25 + 15)
    var plates = S.plates.filter(function (p) { return !off[p]; }).sort(function (a, b) { return (b === std) - (a === std) || b - a; });
    var res = { plates: [], side: 0, exact: true }, note = '';
    if (!(total >= 0)) total = 0;
    if (total > 1500) { total = 1500; }
    if (total < bar) note = total > 0 ? "That's lighter than the bar. The bar alone is " + fmt(bar) + " " + unit + "." : '';
    else { res = solve((total - bar) / 2, plates); }
    var loaded = bar + res.side * 2;
    var left = res.plates.slice().reverse();
    el.appendChild(block('end')); left.forEach(function (p) { el.appendChild(plateEl(p)); }); el.appendChild(block('collar'));
    el.appendChild(block('shaft'));
    el.appendChild(block('collar')); res.plates.forEach(function (p) { el.appendChild(plateEl(p)); }); el.appendChild(block('end'));
    var per = res.plates.length ? res.plates.map(fmt).join(' + ') : 'Nothing. Just the bar.';
    $('per').textContent = per;
    $('perlabel').textContent = res.plates.length ? 'Each side (' + fmt(res.side) + ' ' + unit + ')' : 'Each side';
    if (total >= bar && !res.exact) note = "You can't make " + fmt(total) + " exactly with these plates. The closest below it is " + fmt(loaded) + " " + unit + ".";
    else if (total >= bar && LINES[unit][total] && res.plates.length && res.plates.every(function (p) { return p === std; })) note = LINES[unit][total];
    else if (total === bar) note = "Everyone starts with the bar.";
    $('note').textContent = note;
    el.setAttribute('aria-label', 'A ' + fmt(bar) + ' ' + unit + ' bar with ' + (res.plates.length ? res.plates.map(fmt).join(', ') + ' on each side' : 'no plates') + ', ' + fmt(loaded) + ' ' + unit + ' in total');
    [].forEach.call($('quick').children, function (b) { b.setAttribute('aria-pressed', parseFloat(b.textContent) === total ? 'true' : 'false'); });
  }

  $('w').addEventListener('input', draw);
  $('minus').addEventListener('click', function () { var s = SETS[unit].step; $('w').value = fmt(Math.max(0, (parseFloat($('w').value) || 0) - s)); draw(); });
  $('plus').addEventListener('click', function () { var s = SETS[unit].step; $('w').value = fmt((parseFloat($('w').value) || 0) + s); draw(); });
  controls(); draw();
})();
</script>
</body>
</html>
