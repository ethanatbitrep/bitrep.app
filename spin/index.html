<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spin the wheel | BitRep</title>
<meta name="description" content="Can't decide what to train, or how to finish? Spin the wheel.">
<link rel="canonical" href="https://bitrep.app/spin/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="BitRep">
<meta property="og:url" content="https://bitrep.app/spin/">
<meta property="og:title" content="Spin the wheel">
<meta property="og:description" content="Can't decide what to train, or how to finish? Spin the wheel.">
<meta property="og:image" content="https://bitrep.app/img/share-2.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#0E1020">
<meta name="color-scheme" content="dark">
<link rel="icon" href="../favicon.ico" sizes="any">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="stylesheet" href="../home.css?v=2">
<style>
/* Spin the wheel. Uses the home page's colours, type and buttons. */
.spin { max-width: 560px; margin: 0 auto; padding-top: clamp(28px, 5vw, 64px); padding-bottom: 72px; text-align: center; }
.spin h1 { font-size: clamp(34px, 7vw, 56px); }
.spin .lede { margin: 14px auto 0; }
.modes { display: inline-flex; gap: 8px; margin-top: 24px; padding: 6px; background: var(--card); border-radius: 16px; }
.modes button { min-height: 44px; padding: 0 18px; border: 0; border-radius: var(--r-control); background: transparent; color: var(--muted); font: 700 16px/1 var(--body); cursor: pointer; }
.modes button[aria-pressed="true"] { background: var(--raised); color: var(--text); }
.stage { position: relative; margin: 26px auto 0; max-width: 520px; border-radius: var(--r-card); overflow: hidden; background:
    url("../img/skyline.svg") bottom center / auto 120px repeat-x,
    radial-gradient(rgba(255,255,255,0.16) 0.8px, transparent 1.3px) 0 0 / 26px 26px,
    radial-gradient(rgba(143,141,255,0.24) 0.8px, transparent 1.3px) 13px 19px / 40px 40px, #0B0D1A;
  box-shadow: inset 0 0 0 1px var(--line); padding: 26px 18px 0; }
.moon { position: absolute; right: 22px; top: 18px; width: 28px; height: 28px; background: #C9CCE0; }
.moon::after { content: ""; position: absolute; left: -8px; top: -4px; width: 24px; height: 24px; background: #0B0D1A; }
.wheelbox { position: relative; width: min(100%, 400px); margin: 0 auto; aspect-ratio: 1; }
.wheelbox canvas { display: block; width: 100%; height: 100%; }
#fx { position: absolute; inset: 0; pointer-events: none; }
/* a stepped pixel arrow */
.pointer { position: absolute; left: 50%; top: -10px; width: 40px; height: 40px; margin-left: -20px; z-index: 2; background: var(--mint);
  clip-path: polygon(0 0, 100% 0, 100% 25%, 75% 25%, 75% 50%, 62% 50%, 62% 100%, 38% 100%, 38% 50%, 25% 50%, 25% 25%, 0 25%); }
.floor { display: flex; align-items: flex-end; justify-content: space-between; margin-top: -34px; position: relative; z-index: 1; }
.pet { width: 132px; height: 132px; display: block; }
.pet.hop { animation: pethop .45s steps(4) 3; }
@keyframes pethop { 50% { transform: translateY(-18px); } }
.stage .ground { height: 6px; margin: -6px -18px 0; }
.go { min-height: 54px; padding: 0 30px; font-size: 18px; margin-bottom: 26px; }
.go[disabled] { opacity: 0.5; cursor: default; }
.who { margin-top: 18px; }
.who span { display: block; font-size: 13px; font-weight: 700; color: var(--muted); letter-spacing: 0.04em; margin-bottom: 8px; }
.who div { display: flex; justify-content: center; gap: 8px; }
.who button { width: 48px; height: 48px; padding: 4px; border: 0; border-radius: var(--r-control); background: var(--card); box-shadow: inset 0 0 0 1px var(--line); cursor: pointer; }
.who button[aria-pressed="true"] { box-shadow: inset 0 0 0 2px var(--accent); background: var(--raised); }
.who img { width: 100%; height: 100%; display: block; }
.out { min-height: 168px; margin-top: 22px; background: var(--card); border-radius: var(--r-card); padding: 22px 18px; }
.out .kicker { font-size: 13px; font-weight: 700; letter-spacing: 0.1em; color: #FFC93C; }
.out h2 { font-family: var(--pixel); font-size: clamp(26px, 6vw, 38px); letter-spacing: 0.01em; line-height: 1.15; margin-top: 8px; text-wrap: balance; }
.out p { color: var(--muted); margin-top: 10px; font-size: 17px; }
.out .wait { color: var(--dim); }
.spin .fine { margin-top: 8px; }
.cta { margin-top: 40px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
.cta p { color: var(--muted); max-width: 44ch; }
</style>
</head>
<body>
<header class="bar">
  <div class="bar-in wrap">
    <a href="../" aria-label="BitRep home"><img class="wordmark" src="../img/bitrep-wordmark-white.svg" alt="BitRep" width="130" height="28"></a>
    <a class="btn" href="../#join">Get early access</a>
  </div>
</header>

<main class="wrap spin">
  <h1>Spin the wheel</h1>
  <p class="lede" id="lede"></p>
  <div class="modes" role="group" aria-label="What the wheel decides">
    <button type="button" id="m-finish" aria-pressed="true">Finisher</button>
    <button type="button" id="m-today" aria-pressed="false">Today's workout</button>
  </div>

  <div class="stage">
    <span class="moon" aria-hidden="true"></span>
    <div class="wheelbox">
      <span class="pointer" aria-hidden="true"></span>
      <canvas id="wheel" width="1200" height="1200" role="img" aria-label="A wheel divided into slices, one for each option"></canvas>
      <canvas id="fx" width="880" height="880" aria-hidden="true"></canvas>
    </div>
    <div class="floor">
      <img class="pet" id="pet" src="../bitrun/sprites/fox/4.png" width="292" height="292" alt="">
      <button class="btn go" id="go" type="button">Spin</button>
    </div>
    <div class="ground"></div>
  </div>

  <div class="who"><span>WHO'S SPINNING?</span><div id="who"></div></div>

  <div class="out" aria-live="polite">
    <span class="kicker" id="kicker"></span>
    <h2 id="what"></h2>
    <p id="line"></p>
  </div>
  <p class="fine">If a spin doesn't suit you today, spin again. BitRep is a training log, not medical advice.</p>

  <div class="cta">
    <p>BitRep is a workout tracker coming to iPhone, with a pixel companion that grows when you train.</p>
    <a class="btn" href="../#join">Get early access</a>
  </div>
</main>

<script>
(function () {
  // [label on the wheel, what it says when it lands, a line underneath]
  var WHEELS = {
    finish: { lede: "Finished your workout and still have something left? Let the wheel pick how you end it.", kicker: 'YOUR FINISHER', items: [
      ['PUSH-UPS', '50 push-ups', "Break them up however you like. They all count."],
      ['PLANK', 'A 2-minute plank', "The second minute is longer than the first. Sorry."],
      ['400M', '400 metres, all out', "One lap. Leave nothing for the walk to the car."],
      ['SQUATS', '100 bodyweight squats', "Sets of ten. Don't think about the stairs later."],
      ['BURPEES', '30 burpees', "Nobody likes them. That's sort of the point."],
      ['CARRY', "A farmer's carry until you drop it", "Heaviest dumbbells you can hold. Walk until your grip goes."],
      ['DEAD HANG', 'A dead hang for as long as you can', "Time it. Next week, beat it by a second."],
      ['CURLS', 'Three sets of 21s', "Bottom half, top half, then the whole curl. Seven of each."],
      ['STRETCH', '10 minutes of stretching', "The thing you always skip. Not today."],
      ['GO HOME', "Go home. You've done enough.", "The wheel has spoken. Eat something."] ] },
    today: { lede: "Can't decide what to train? Spin, and do what it says.", kicker: "TODAY IT'S", items: [
      ['PUSH', 'Push day', "Chest, shoulders and triceps."],
      ['PULL', 'Pull day', "Back and biceps. Bring your straps."],
      ['LEGS', 'Leg day', "You knew it was on there."],
      ['RUN', 'A run', "Any distance. Out the door is the hard part."],
      ['UPPER', 'Upper body', "A bit of everything above the belt."],
      ['FULL BODY', 'Full body', "One big lift for legs, one push, one pull."],
      ['EASY CARDIO', 'Easy cardio', "Thirty minutes where you could still hold a conversation."],
      ['REST', 'A rest day', "Take it. Resting is part of training."] ] }
  };
  var COLORS = [['#8F8DFF', '#0E1020'], ['#22263F', '#F3F3FA'], ['#5EE0B0', '#0E1020'], ['#171A2E', '#F3F3FA'], ['#FFC93C', '#0E1020'], ['#2B3052', '#F3F3FA']];
  var PETS = [['fox', 'Ember'], ['bear', 'Boulder'], ['panther', 'Onyx'], ['wolf', 'Slate'], ['rabbit', 'Dash'], ['panda', 'Domino']];
  var $ = function (id) { return document.getElementById(id); };
  var cv = $('wheel'), cx = cv.getContext('2d'), mode = 'finish', angle = 0, spinning = false, last = -1;
  var still = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var hub = new Image(), pet = 'fox';
  // BitRun and the quiz remember a chosen companion in the browser; start with that one if it is one of the six.
  try { var saved = localStorage.getItem('emberRunPet'); if (PETS.some(function (p) { return p[0] === saved; })) pet = saved; } catch (e) {}
  function petName() { return PETS.filter(function (p) { return p[0] === pet; })[0][1]; }

  function paint() {
    var items = WHEELS[mode].items, n = items.length, R = cv.width / 2, slice = Math.PI * 2 / n, i, u = R / 440;
    cx.clearRect(0, 0, cv.width, cv.height); cx.imageSmoothingEnabled = true;
    cx.save(); cx.translate(R, R); cx.rotate(angle);
    for (i = 0; i < n; i++) {
      // with an odd number of colours left over, the last slice never matches the first
      var col = COLORS[(i === n - 1 && (n - 1) % COLORS.length === 0) ? 2 : i % COLORS.length];
      cx.beginPath(); cx.moveTo(0, 0); cx.arc(0, 0, R - 16 * u, i * slice - Math.PI / 2 - slice / 2, (i + 1) * slice - Math.PI / 2 - slice / 2); cx.closePath();
      cx.fillStyle = col[0]; cx.fill();
      cx.save(); cx.rotate(i * slice); cx.fillStyle = col[1]; cx.textAlign = 'center'; cx.textBaseline = 'middle';
      cx.font = '700 ' + Math.round((items[i][0].length > 9 ? 30 : 36) * u) + 'px "Pixelify Sans", Archivo, sans-serif';
      cx.translate(0, -(R * 0.64)); cx.rotate(-Math.PI / 2); cx.fillText(items[i][0], 0, 0); cx.restore();
    }
    // a clean dark line between every pair of slices
    cx.strokeStyle = '#0E1020'; cx.lineWidth = 6 * u; cx.lineCap = 'butt';
    for (i = 0; i < n; i++) { var a = i * slice - Math.PI / 2 - slice / 2; cx.beginPath(); cx.moveTo(0, 0); cx.lineTo(Math.cos(a) * (R - 16 * u), Math.sin(a) * (R - 16 * u)); cx.stroke(); }
    cx.restore();
    cx.beginPath(); cx.arc(R, R, R - 9 * u, 0, Math.PI * 2); cx.lineWidth = 14 * u; cx.strokeStyle = '#3A4070'; cx.stroke();
    // the hub: the companion's face in a square frame, which stays upright while the wheel turns
    var h = 168 * u; cx.fillStyle = '#5EE0B0'; cx.fillRect(R - h / 2 - 8 * u, R - h / 2 - 8 * u, h + 16 * u, h + 16 * u);
    cx.fillStyle = '#0E1020'; cx.fillRect(R - h / 2, R - h / 2, h, h);
    if (hub.complete && hub.naturalWidth) cx.drawImage(hub, R - h / 2 + 8 * u, R - h / 2 + 8 * u, h - 16 * u, h - 16 * u);
  }

  function choose(id) {
    pet = id; hub.src = '../bitrun/tiles/' + id + '.png'; $('pet').src = '../bitrun/sprites/' + id + '/4.png'; $('pet').alt = petName() + ', your companion';
    [].forEach.call($('who').children, function (b) { b.setAttribute('aria-pressed', b.dataset.id === id ? 'true' : 'false'); });
    try { localStorage.setItem('emberRunPet', id); } catch (e) {}
    if (!spinning && $('what').textContent) $('kicker').textContent = petName().toUpperCase() + ' PICKED';
  }
  hub.onload = function () { if (!spinning) paint(); };
  PETS.forEach(function (p) {
    var b = document.createElement('button'); b.type = 'button'; b.dataset.id = p[0]; b.setAttribute('aria-label', p[1]);
    var im = new Image(); im.src = '../bitrun/tiles/' + p[0] + '.png'; im.alt = ''; b.appendChild(im);
    b.addEventListener('click', function () { choose(p[0]); }); $('who').appendChild(b);
  });

  // a short burst of pixel confetti when the wheel stops, like the app's finish screen
  function confetti() {
    if (still) return;
    var fx = $('fx'), c = fx.getContext('2d'), bits = [], t0 = performance.now(), cols = ['#8F8DFF', '#5EE0B0', '#FFC93C', '#F3F3FA', '#FF7A7A'];
    for (var i = 0; i < 70; i++) bits.push({ x: 440 + (Math.random() - 0.5) * 120, y: 380, vx: (Math.random() - 0.5) * 14, vy: -6 - Math.random() * 12, c: cols[i % cols.length], s: Math.random() < 0.5 ? 12 : 16 });
    (function f(now) {
      var k = (now - t0) / 1400; c.clearRect(0, 0, 880, 880); if (k >= 1) return;
      bits.forEach(function (b) { b.x += b.vx; b.y += b.vy; b.vy += 0.55; c.globalAlpha = 1 - k * k; c.fillStyle = b.c; c.fillRect(Math.round(b.x / 4) * 4, Math.round(b.y / 4) * 4, b.s, b.s); });
      requestAnimationFrame(f);
    })(t0);
  }

  function setMode(m) {
    if (spinning) return;
    mode = m; angle = 0; last = -1;
    $('m-finish').setAttribute('aria-pressed', m === 'finish'); $('m-today').setAttribute('aria-pressed', m === 'today');
    $('lede').textContent = WHEELS[m].lede; idle();
    paint();
  }

  function idle() { $('kicker').textContent = ''; $('what').textContent = ''; $('line').innerHTML = '<span class="wait">Give it a spin.</span>'; }

  function spin() {
    if (spinning) return;
    var items = WHEELS[mode].items, n = items.length, slice = Math.PI * 2 / n, pick;
    do { pick = Math.floor(Math.random() * n); } while (n > 1 && pick === last);   // never the same thing twice in a row
    last = pick;
    // land somewhere inside the chosen slice, not always dead centre
    var offset = (Math.random() - 0.5) * slice * 0.7;
    var target = -pick * slice + offset, turns = still ? 1 : 5;
    var from = angle % (Math.PI * 2), to = target - Math.PI * 2 * turns;
    while (to > from - Math.PI * 2 * turns) to -= Math.PI * 2;
    var t0 = performance.now(), dur = still ? 500 : 4200;
    spinning = true; $('go').disabled = true; $('kicker').textContent = ''; $('what').textContent = ''; $('line').innerHTML = '<span class="wait">' + petName() + ' is choosing.</span>';
    (function frame(now) {
      var k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 4);
      angle = from + (to - from) * e; paint();
      if (k < 1) { requestAnimationFrame(frame); return; }
      spinning = false; $('go').disabled = false; $('go').textContent = 'Spin again';
      $('kicker').textContent = petName().toUpperCase() + ' PICKED'; $('what').textContent = items[pick][1]; $('line').textContent = items[pick][2];
      confetti(); var pe = $('pet'); pe.classList.remove('hop'); void pe.offsetWidth; pe.classList.add('hop');
    })(t0);
  }

  $('m-finish').addEventListener('click', function () { setMode('finish'); });
  $('m-today').addEventListener('click', function () { setMode('today'); });
  $('go').addEventListener('click', spin);
  choose(pet); setMode('finish');
  if (document.fonts && document.fonts.load) document.fonts.load('700 36px "Pixelify Sans"').then(paint, paint);
})();
</script>
</body>
</html>
